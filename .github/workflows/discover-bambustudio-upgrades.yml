name: Discover BambuStudio Upgrades

on:
  schedule:
    # 08:00 in China Standard Time (UTC+8) is 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: discover-bambustudio-upgrades
  cancel-in-progress: false

jobs:
  discover:
    name: Check latest stable release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Discover and open upgrade PR
        run: bun run discover-upgrades
        env:
          # Use a PAT or GitHub App token here if the resulting PR should
          # trigger CI automatically. GITHUB_TOKEN-created PRs are useful for
          # dry runs but usually do not trigger follow-up workflow runs.
          GH_TOKEN: ${{ secrets.BAMBU_UPGRADE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
