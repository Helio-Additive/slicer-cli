name: slicer-cli Release

on:
  push:
    tags:
      - "slicer-cli/v*"   # e.g. slicer-cli/v1.0.0

permissions:
  contents: write  # needed to create a GitHub Release

jobs:
  release:
    name: Release — ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS-arm64
            runner: macos-14
            artifact_name: slicer_cli-macos-arm64
          - os: macOS-x86_64
            runner: macos-13
            artifact_name: slicer_cli-macos-x86_64
          - os: Linux-x86_64
            runner: ubuntu-22.04
            artifact_name: slicer_cli-linux-x86_64
          - os: Windows-x86_64
            runner: windows-2022
            artifact_name: slicer_cli-windows-x86_64.exe

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: bash install_deps.sh

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libtbb-dev libeigen3-dev libpng-dev zlib1g-dev \
            libexpat1-dev libssl-dev libboost-all-dev \
            libcgal-dev libopencv-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev \
            libocct-foundation-dev libocct-draw-dev \
            libqhull-dev libcereal-dev libfreetype-dev libfontconfig-dev \
            libnlopt-dev libicu-dev
          git clone --depth=1 https://github.com/bambulab/libnoise.git /tmp/libnoise
          cmake -S /tmp/libnoise -B /tmp/libnoise/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          sudo cmake --build /tmp/libnoise/build --target install --parallel

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # vcpkg is pre-installed on GitHub Actions Windows runners
          vcpkg install \
            tbb:x64-windows eigen3:x64-windows \
            boost-filesystem:x64-windows boost-thread:x64-windows \
            boost-log:x64-windows boost-regex:x64-windows boost-locale:x64-windows \
            cgal:x64-windows "opencv[core]:x64-windows" opencascade:x64-windows \
            qhull:x64-windows cereal:x64-windows nlopt:x64-windows \
            openssl:x64-windows libpng:x64-windows zlib:x64-windows \
            expat:x64-windows freetype:x64-windows
          # libnoise (Bambu fork) — not in vcpkg, build from source
          git clone --depth=1 https://github.com/bambulab/libnoise.git /c/libnoise
          cmake -S /c/libnoise -B /c/libnoise/build \
            -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_INSTALL_PREFIX=/c/libnoise/install \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build /c/libnoise/build --config Release --target install

      - name: Configure
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/usr/local;/usr/lib/x86_64-linux-gnu/cmake/opencascade;/usr/share/opencascade"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Assert package metadata
        if: runner.os != 'Windows'
        run: |
          if grep -q "CPACK_PACKAGE_NAME.*slicer_cli" build/CPackConfig.cmake; then
            echo "PASS: CPACK_PACKAGE_NAME is slicer_cli"
          else
            echo "FAIL: package name regressed — expected slicer_cli"
            grep "CPACK_PACKAGE_NAME" build/CPackConfig.cmake || true
            exit 1
          fi

      - name: Run exclusion regression tests
        if: runner.os != 'Windows'
        run: bash tests/test_excluded_features.sh build/slicer_cli

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          bash scripts/bundle-macos.sh build/slicer_cli dist
          bash scripts/smoke-clean-host.sh dist/slicer_cli

      - name: Package binary + SHA-256
        if: runner.os != 'Windows'
        run: |
          BINARY=build/slicer_cli
          [ -f dist/slicer_cli ] && BINARY=dist/slicer_cli
          TARBALL="${{ matrix.artifact_name }}.tar.gz"
          tar czf "$TARBALL" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
          # SHA-256 checksum — slicer-updater expects <binary_name>.sha256
          # containing just the hex digest (no filename suffix).
          shasum -a 256 "$TARBALL" | awk '{print $1}' > "$TARBALL.sha256"
          echo "SHA-256: $(cat "$TARBALL.sha256")"

      - name: Package binary + SHA-256 (Windows)
        if: runner.os == 'Windows'
        run: |
          $b = "build\Release\slicer_cli.exe"
          if (-not (Test-Path $b)) { $b = "build\slicer_cli.exe" }
          $dest = "${{ matrix.artifact_name }}"
          Copy-Item $b $dest
          # SHA-256 checksum
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          $hash | Out-File -NoNewline "$dest.sha256"
          Write-Host "SHA-256: $hash"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}*
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
