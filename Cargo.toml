[package]
name = "helio-slicer-cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[[bin]]
name = "slicer-cli"
path = "src/main.rs"

[dependencies]
aws-config = "1.8.8"
aws-sdk-s3 = "1.106.0"
base64 = "0.22.1"
clap = { version = "4.5.31", features = ["derive", "env"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
schemars = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.17.1"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
walkdir = "2.5.0"

[build-dependencies]
schemars = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
