[package]
name = "slicer-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "slicer-cli"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }

[build-dependencies]
cxx-build = "1.0"
