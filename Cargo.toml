[package]
name = "helio-slicer-cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[[bin]]
name = "slicer-cli"
path = "src/main.rs"

[dependencies]
env_logger = "0.10"
aws-config = "1.8.8"
aws-sdk-s3 = "1.106.0"
base64 = "0.22.1"
clap = { version = "4.5.31", features = ["derive", "env"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
schemars = "1.1.0"
slicer = { path = "crates/libslic3r-rs" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10"
tempfile = "3.17.1"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
walkdir = "2.5.0"

[build-dependencies]
schemars = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"

# The Rust slicing engine mirrors C++ libslic3r's `assert()`s as `debug_assert!`.
# C++ release (NDEBUG) compiles those to no-ops, and the C++ golden G-code is a
# release build — so for faithful parity the in-process engine must run with
# debug-assertions OFF even in a dev `cargo build` (otherwise e.g. the degenerate
# slice-line assert at triangle_mesh_slicer.rs:294 legitimately fires on Benchy).
# This per-package override gives the engine C++-release assert semantics while
# keeping the rest of the dev build normal, so `compare` works in one command.
[profile.dev.package.slicer]
debug-assertions = false
# Also optimize just the engine in dev builds: an unoptimized Benchy slice takes
# minutes, which makes `compare` impractical. opt-level=3 on this one package
# keeps `cargo build` fast elsewhere while the slice runs in seconds.
opt-level = 3
