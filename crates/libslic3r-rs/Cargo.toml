[package]
name = "slicer"
version = "0.1.0"
edition = "2021"
authors = ["alexdaima"]
description = "A Rust rewrite of the BambuStudio core slicing algorithm"
license = "AGPL-3.0"
repository = "https://github.com/alexdaima/slicer"
keywords = ["3d-printing", "slicer", "gcode", "stl"]
categories = ["graphics", "rendering"]

[lib]
name = "slicer"
path = "src/lib.rs"

[[bin]]
name = "slicer-cli"
path = "src/bin/slicer-cli.rs"

[[bin]]
name = "generate-test-meshes"
path = "src/bin/generate-test-meshes.rs"

[dependencies]
# Geometry & Math
nalgebra = "0.32"
geo = "0.27"
geo-clipper = "0.8"
clipper2 = "0.5"
# Raw Clipper2 FFI (already linked transitively via `clipper2`). Exposes the
# native PolyTree64 / ClipperOffset / Clipper64::Execute(closed, open) APIs that
# the safe `clipper2` wrapper hides, which Clipper2Utils.cpp depends on for
# byte-exact PolyTreeToExPolygons and open-subject (solution_open) recovery.
clipper2c-sys = "0.1.6"
ordered-float = "4.2"
boostvoronoi = "0.12"
# Polygon tessellation (pure-Rust earcut; wasm-safe). Backend for Tesselate.cpp.
# C++ uses native glu-libtess which is not wasm-safe; see src/tesselate.rs.
earcutr = "0.4"

# Time handling
chrono = "0.4"

# Bitflags for state management
bitflags = "2.4"

# Mesh Processing
stl_io = "0.7"
rstar = "0.11"

# Parallelism
rayon = "1.8"
parking_lot = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Random number generation (for monotonic infill ant colony optimization)
rand = "0.8"

# Utilities
log = "0.4"
env_logger = "0.10"
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = "0.31"
# PNG codec backend for PNGReadWrite.cpp (libpng replacement).
# C++ uses native libpng (<png.h>) which is not wasm-safe; flate2 + miniz_oxide
# is pure-Rust and wasm-safe, already present transitively via `zip`.
flate2 = "1.0"

# Async (for MCP server)
tokio = { version = "1.34", features = ["full"] }

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "psapi", "winnt"] }

[dev-dependencies]
criterion = "0.5"
approx = "0.5"
tempfile = "3.8"
pretty_assertions = "1.4"

[[bench]]
name = "slicing_benchmarks"
harness = false

# [profile.release] and [profile.bench] hoisted to the workspace root Cargo.toml.

# Parity-check profile: C++ golden gcode comes from a release build where assert() is
# compiled out (NDEBUG); faithful ports keep those asserts as debug_assert!, so parity
# slices must run with debug-assertions off to match C++ release semantics.
[profile.parity]
inherits = "dev"
debug-assertions = false
