[package]
name = "slicer"
version = "0.1.0"
edition = "2021"
authors = ["alexdaima"]
description = "A Rust rewrite of the BambuStudio core slicing algorithm"
license = "AGPL-3.0"
repository = "https://github.com/alexdaima/slicer"
keywords = ["3d-printing", "slicer", "gcode", "stl"]
categories = ["graphics", "rendering"]

[lib]
name = "slicer"
path = "src/lib.rs"

[[bin]]
name = "slicer-cli"
path = "src/bin/slicer-cli.rs"

[[bin]]
name = "generate-test-meshes"
path = "src/bin/generate-test-meshes.rs"

[dependencies]
# Geometry & Math
nalgebra = "0.32"
# Eigen FFI shim for the bit-exact slice-time vertex transform (R86): calls the
# real Eigen so the f32 matmul matches C++ exactly (sidesteps the pure-rust
# Eigen-reproduction 1-ULP wall, R85).
ordered-float = "4.2"
boostvoronoi = "0.12"
# Polygon tessellation (pure-Rust earcut; wasm-safe). Backend for Tesselate.cpp.
# C++ uses native glu-libtess which is not wasm-safe; see src/tesselate.rs.
earcutr = "0.4"

# Time handling
chrono = "0.4"

# Bitflags for state management
bitflags = "2.4"

# Mesh Processing
stl_io = "0.7"
rstar = "0.11"

# Parallelism
rayon = "1.8"
parking_lot = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Random number generation (for monotonic infill ant colony optimization)
rand = "0.8"

# Utilities
log = "0.4"
env_logger = "0.10"
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = "0.31"
# PNG codec backend for PNGReadWrite.cpp (libpng replacement).
# C++ uses native libpng (<png.h>) which is not wasm-safe; flate2 + miniz_oxide
# is pure-Rust and wasm-safe, already present transitively via `zip`.
flate2 = "1.0"

# Async (for MCP server)
tokio = { version = "1.34", features = ["full"] }

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "psapi", "winnt"] }

[dev-dependencies]
# Called by examples/voronoi_ab.rs only (a second opinion on the Voronoi diagram).
boost-voronoi-sys = { path = "../boost-voronoi-sys" }
# The C++ the port replaced, kept as the reference of the *_native_parity tests.
eigen-transform-sys = { path = "../eigen-transform-sys" }
# ClipperLib, ClipperLib_Z, the medial axis over boost Voronoi and the elephant-foot solver as
# C++: out of the engine since R903, the reference of the *_native_parity tests.
clipper-z-sys = { path = "../clipper-z-sys" }
# Clipper2 as C++ (the engine's pin, with and without USINGZ): out of the engine, which runs
# on the port (src/clipper2) since R905; the reference of the clipper2_*_native_parity tests.
clipper2-z-sys = { path = "../clipper2-z-sys" }
criterion = "0.5"
approx = "0.5"
tempfile = "3.8"
pretty_assertions = "1.4"

[[bench]]
name = "slicing_benchmarks"
harness = false

# Profiles live in the workspace root Cargo.toml (`parity` among them).
